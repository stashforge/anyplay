[project]
name = "anyplay"
version = "0.9.2"
description = "Terminal media stream player"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "curl-cffi",
    "beautifulsoup4",
    "m3u8>=6.0,<7",
    "pycryptodome>=3.19.0",
]

[project.scripts]
anyplay = "media_cli.cli.main:run"

[project.optional-dependencies]
dev = [
    "mypy==1.19.1",
    "ruff==0.16.8",
    "pytest>=7",
    "cryptography>=41.0.0",
    "tomli>=1; python_version < '3.11'",
]
allanime = [
    "cryptography>=41.0.0",
]
allanime-termux = [
    "pycryptodome>=3.19.0",
]
crypto-termux = [
    "pycryptodome>=3.19.0",
]
miruro = [
    "curl_cffi>=0.7.4",
]
animepahe-browser = [
    "playwright>=1.48.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["media_cli*"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.ruff]
target-version = "py310"
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "T20"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument
    "T201",  # print statements (CLI app uses print)
    "B006",  # mutable default argument (some intentional)
    "B007",  # loop control variable not used
    "C408",  # list comprehension can be generator
]
exclude = ["web/", "scratch/", "*.pyc", "__pycache__/"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T201", "S101"]  # allow print/assert in tests

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
warn_redundant_casts = true
strict_bytes = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = false
implicit_optional = false
ignore_missing_imports = false
namespace_packages = true
explicit_package_bases = true
files = ["media_cli"]

[[tool.mypy.overrides]]
module = [
    "media_cli.ui.footer", "media_cli.ui.fuzzy", "media_cli.core.network", "media_cli.core.workers",
    "media_cli.ui.view_model", "media_cli.ui.picker_state", "media_cli.ui.view_session",
    "media_cli.ui.terminal_runtime", "media_cli.ui.transition",
]
# Spell out mypy 1.19.1 strict flags: `strict = true` here leaks globally.
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true
strict_optional = true
implicit_optional = false
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = ["."]

[tool.coverage.run]
source = ["media_cli"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
